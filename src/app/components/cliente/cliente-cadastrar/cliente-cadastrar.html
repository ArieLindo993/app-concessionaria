<div class="container">
  <p-card header="Formulário de Cadastro de Cliente" class="mt-4"
    subheader="O seguinte cadastro será utilizado em Vendas e Ordens de Serviço">
    <div class="row mt-4">
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-4 col-xl-3">
        <p-floatlabel>
          <input pInputText id="nome" autocomplete="off" />
          <label for="nome">Nome: *</label>
        </p-floatlabel>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-3 col-xl-2">
        <p-floatlabel>
          <p-select id="tipoPessoa" [options]="tipoPessoaOptions" optionLabel="descricao" optionValue="valor" />
          <label for="tipoPessoa">Tipo de Pessoa: *</label>
        </p-floatlabel>
      </div>
    </div>
  </p-card>
</div>
